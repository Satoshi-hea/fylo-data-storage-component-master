<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Google Fonts: Raleway (400, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card card-action">
      <div class="logo">
        <img src="./images/logo.svg" alt="Fylo logo">
      </div>
      <div class="icons">
        <button class="icon-btn" aria-label="Upload document">
          <img src="./images/icon-document.svg" alt="">
        </button>
        <button class="icon-btn" aria-label="Folders">
          <img src="./images/icon-folder.svg" alt="">
        </button>
        <button class="icon-btn" aria-label="Upload to cloud">
          <img src="./images/icon-upload.svg" alt="">
        </button>
      </div>
    </section>
    <section class="card card-storage">
      <p class="storage-text">
        You’ve used <span>815 GB</span> of your storage
      </p>
      <div class="progress-bar-container">
        <div class="progress-bar">
          <span class="progress-dot"></span>
        </div>
      </div>
      <div class="storage-limits">
        <span>0 GB</span>
        <span>1000 GB</span>
      </div>
      <div class="storage-bubble">
        <span class="bubble-number">185</span>
        <span class="bubble-unit">GB LEFT</span>
      </div>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>. 
    Coded by <a href="#">Mykola Kyzym</a>.
  </footer>
</body>
</html>
